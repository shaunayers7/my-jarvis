<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       JARVIS — Picker View
       ------------------------------------------------------------
       Items appear in a centered column.
       Tap the ones you want → pause three seconds,
       the rest fade away, and Jarvis asks
       which one to start with. Your choices land on a list.

       ONE file: HTML + CSS + JS. No frameworks.
       Data: sample items for now (localStorage step).
       Later this swaps to Google Sheets → DeepSeek → Obsidian.
       ============================================================ -->

  <meta charset="UTF-8">

  <!-- Fit phone screens, including iPhone notch areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iPhone "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0e14">

  <title>JARVIS — Picker</title>

  <style>
    /* ==========================================================
       THEME — same variables as index.html so the app matches
       ========================================================== */
    :root {
      --bg:      #0a0e14;
      --panel:   #111722;
      --accent:  #00d4ff;
      --text:    #e8f1f8;
      --dim:     #7a8a9e;
      --good:    #3ddc84;
      --glow:    rgba(0, 212, 255, 0.35);
      --settle:  cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ==========================================================
       TOP BAR — back button + title
       ========================================================== */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 16px 8px;
    }

    .back {
      width: 46px;
      height: 46px;               /* big touch target */
      border-radius: 50%;
      border: 1px solid rgba(0, 212, 255, 0.3);
      background: var(--panel);
      color: var(--accent);
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .back:active {
      transform: scale(0.92);
      box-shadow: 0 0 18px var(--glow);
    }

    .topbar-title {
      font-size: 1.15rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 14px var(--glow);
    }

    /* ==========================================================
       JARVIS LINE — the "face" of it: one clean line of text
       ========================================================== */
    .jarvis-line {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px 4px;
      min-height: 56px;
    }

    .reactor {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px  var(--glow); opacity: 0.85; }
      50%      { box-shadow: 0 0 18px var(--glow); opacity: 1;    }
    }

    #jarvis-text {
      font-size: 1rem;
      color: var(--text);
      line-height: 1.35;
    }

    /* ==========================================================
       CARD LIST — normal flow keeps every card separated
       ========================================================== */
    .sky {
      flex: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      gap: 16px;
      width: 100%;
      max-width: 520px;
      margin: 8px auto;
      padding: 16px 20px;
      animation: reveal 0.36s var(--settle);
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Each bubble = one item you can pick */
    .bubble {
      width: 100%;
      min-width: 0;
      min-height: 64px;
      text-align: left;
      font: inherit;
      color: var(--text);
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 18px;
      padding: 14px 16px;
      cursor: pointer;
      transition: opacity 0.24s ease,
                  background-color 0.18s ease-out,
                  border-color 0.18s ease-out, box-shadow 0.18s ease-out;
    }

    .bubble:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .bubble-name {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .bubble-meta {
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--dim);
    }

    /* Highlight without moving the card while more picks are being made. */
    .bubble.picked {
      animation: none;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--glow);
      background: rgba(0, 212, 255, 0.08);
    }

    /* ==========================================================
       BOTTOM BAR — Done / Clear controls
       ========================================================== */
    .controls {
      display: flex;
      gap: 12px;
      padding: 10px 20px 20px;
      max-width: 520px;
      width: 100%;
      margin: auto auto 0;
    }

    .btn {
      flex: 1;
      padding: 16px;              /* big touch target */
      border-radius: 16px;
      border: 1px solid rgba(0, 212, 255, 0.35);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn:active {
      transform: scale(0.96);
      box-shadow: 0 0 20px var(--glow);
    }

    .btn.primary {
      background: var(--accent);
      color: #04222b;
      border-color: var(--accent);
    }

    .btn.hidden { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .reactor, .bubble, .sky { animation: none; }
      .bubble, .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>

<body>

  <!-- ===================== TOP BAR ===================== -->
  <div class="topbar">
    <a class="back" href="index.html" aria-label="Back to home">←</a>
    <span class="topbar-title">PICKER</span>
  </div>

  <!-- ===================== JARVIS SPEAKS HERE ===================== -->
  <div class="jarvis-line">
    <span class="reactor"></span>
    <span id="jarvis-text">One moment…</span>
  </div>

  <!-- ===================== THE SKY (bubbles live here) ===================== -->
  <div class="sky" id="sky"></div>

  <!-- ===================== CONTROLS ===================== -->
  <div class="controls">
    <button class="btn" id="clear-btn">Clear</button>
    <button class="btn primary" id="done-btn">Done</button>
  </div>

  <script>
    /* ==========================================================
       SAMPLE DATA — this is the "localStorage step" of the plan.
       LATER this exact list shape comes from Google Sheets
       (filament inventory), then DeepSeek, then your vault.
       Keep the same fields and nothing else has to change.
       ========================================================== */
    const SAMPLE_ITEMS = [
      { id: "p1",  name: "Phone stand — desk",        meta: "PETG black · ~2h"    },
      { id: "p2",  name: "Panel mount bracket",       meta: "Electric Boyes · ~1h" },
      { id: "p3",  name: "Cable clips ×20",           meta: "PLA grey · ~3h"      },
      { id: "p4",  name: "Label maker battery cover", meta: "PLA white · ~45m"    },
      { id: "p5",  name: "Shop sign — Dynamic Media", meta: "PETG teal · ~6h"     },
      { id: "p6",  name: "Filament dry box clips",    meta: "PETG · ~1h"          },
      { id: "p7",  name: "Drill bit organizer",       meta: "PLA red · ~4h"       },
      { id: "p8",  name: "Key fob — shop logo",       meta: "PLA silk · ~30m"     },
      { id: "p9",  name: "Outlet cover spacers",      meta: "Electric Boyes · ~1h" },
      { id: "p10", name: "Headphone wall hook",       meta: "PETG black · ~2h"    }
    ];

    /* ==========================================================
       STATE — what's on screen and what you've picked
       ========================================================== */
    const PICK_PAUSE = 3000;
    let pickTimer = null;
    let items  = [...SAMPLE_ITEMS];
    let picked = [];                // items you've tapped
    let phase  = "pick";            // "pick" → "chooseFirst" → done

    const sky        = document.getElementById("sky");
    const jarvisText = document.getElementById("jarvis-text");
    const doneBtn    = document.getElementById("done-btn");
    const clearBtn   = document.getElementById("clear-btn");

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    async function fadeElements(elements, from, to, duration) {
      if (reduceMotion() || !Element.prototype.animate) return;
      await Promise.all(elements.map(el => el.animate(
        [{ opacity: from }, { opacity: to }],
        { duration, easing: "ease-in-out", fill: "forwards" }
      ).finished));
    }

    async function settleCards(sky, selected) {
      const cards = [...sky.querySelectorAll(".bubble")];
      const remaining = selected.map(item =>
        sky.querySelector('[data-id="' + item.id + '"]'));
      const dismissed = cards.filter(card => !remaining.includes(card));
      const animated = !reduceMotion() && Boolean(Element.prototype.animate);
      cards.forEach(card => { card.disabled = true; });

      await fadeElements(dismissed, 1, 0, 240);
      // Reorder only while invisible, so selected cards never cross.
      await fadeElements(remaining, 1, 0, 140);
      const oldHeight = sky.getBoundingClientRect().height;
      dismissed.forEach(card => card.remove());
      remaining.forEach(card => {
        if (animated) card.getAnimations().forEach(animation => animation.cancel());
        card.removeAttribute("aria-pressed");
        sky.appendChild(card);
      });
      const newHeight = sky.getBoundingClientRect().height;
      if (animated) {
        // One measured height transition prevents the surrounding page jumping.
        const resize = sky.animate(
          [{ height: oldHeight + "px" }, { height: newHeight + "px" }],
          { duration: 320, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
        );
        await Promise.all([resize.finished, fadeElements(remaining, 0, 1, 320)]);
        remaining.forEach(card => card.getAnimations().forEach(animation => animation.cancel()));
      }
      remaining.forEach(card => { card.disabled = false; });
    }

    /* ==========================================================
       JARVIS SPEAKS — one clean line at a time
       ========================================================== */
    function jarvisSays(text) {
      jarvisText.textContent = text;
    }

    /* ==========================================================
       SELECTION TIMER — each tap gives you another three seconds
       ========================================================== */
    function schedulePicks() {
      clearTimeout(pickTimer);
      if (picked.length) pickTimer = setTimeout(onDone, PICK_PAUSE);
    }

    /* ==========================================================
       RENDER — build the bubbles from the items list
       ========================================================== */
    function renderSky() {
      sky.innerHTML = "";
      items.forEach(item => {
        const bubble = document.createElement("button");
        bubble.type = "button";
        bubble.className = "bubble";
        if (picked.some(p => p.id === item.id)) bubble.classList.add("picked");
        if (phase === "pick") bubble.setAttribute("aria-pressed",
          picked.some(p => p.id === item.id));
        bubble.disabled = phase === "done";
        bubble.dataset.id = item.id;
        bubble.innerHTML =
          '<div class="bubble-name">' + item.name + '</div>' +
          '<div class="bubble-meta">' + item.meta + '</div>';
        bubble.addEventListener("click", () => onBubbleTap(item.id));
        sky.appendChild(bubble);
      });
    }

    /* ==========================================================
       TAP A BUBBLE
       Pick phase:    toggle it picked/unpicked.
       Choose-first:  tapping one names it your starting task.
       ========================================================== */
    function onBubbleTap(id) {
      if (phase === "pick") {
        const item = items.find(i => i.id === id);
        const idx  = picked.findIndex(p => p.id === id);

        if (idx >= 0) {
          picked.splice(idx, 1);                       // unpick it
        } else {
          picked.push(item);                           // pick it
        }

        const bubble = sky.querySelector('[data-id="' + id + '"]');
        bubble.classList.toggle("picked");
        bubble.setAttribute("aria-pressed", bubble.classList.contains("picked"));
        schedulePicks();

        if (picked.length === 0) {
          jarvisSays("Here are your " + items.length + " prints. Tap the ones you want to do.");
        } else {
          jarvisSays(picked.length + " selected. Keep picking, or pause 3 seconds to line them up.");
        }
      } else if (phase === "chooseFirst") {
        const item = picked.find(p => p.id === id);
        startWith(item);
      }
    }

    /* ==========================================================
       DONE — fade the unpicked, then ask "which first?"
       ========================================================== */
    async function onDone() {
      if (phase !== "pick") return;
      clearTimeout(pickTimer);

      if (picked.length === 0) {
        jarvisSays("Nothing selected. Tap a few bubbles first.");
        return;
      }

      phase = "settling";
      items = [...picked];
      await settleCards(sky, items);
      phase = "chooseFirst";
      sky.scrollIntoView({ block: "start", behavior: reduceMotion() ? "auto" : "smooth" });
      jarvisSays("Which one would you like to start with?");
    }

    /* ==========================================================
       START WITH — your first task gets named and saved
       ========================================================== */
    function startWith(item) {
      phase = "done";
      sky.querySelectorAll(".bubble").forEach(b => { b.disabled = true; });

      // Save the whole working list — first task marked.
      // localStorage = step 1 of the data plan. Today view
      // will read this same key later.
      const list = picked.map(p => ({ ...p, first: p.id === item.id }));
      localStorage.setItem("jarvis.printQueue", JSON.stringify(list));

      jarvisSays('Starting with "' + item.name + '." ' +
                 picked.length + " items on your list. It's saved.");

      // Swap Done for a "View list" path home (Today view comes next)
      doneBtn.textContent = "Back to home";
      doneBtn.onclick = () => (window.location.href = "index.html");
      clearBtn.classList.add("hidden");
    }

    /* ==========================================================
       CLEAR — unpick everything, back to the full sky
       ========================================================== */
    function onClear() {
      if (phase !== "pick") return;
      clearTimeout(pickTimer);
      picked = [];
      renderSky();
      jarvisSays("Cleared. Tap the ones you want to do.");
    }

    /* ==========================================================
       WIRE IT UP + OPENING LINE
       ========================================================== */
    doneBtn.addEventListener("click", onDone);
    clearBtn.addEventListener("click", onClear);

    renderSky();
    jarvisSays("Here are your " + items.length +
               " prints. Tap your picks, then pause 3 seconds or tap Done.");
  </script>
</body>
</html>
