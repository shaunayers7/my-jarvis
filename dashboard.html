<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       JARVIS — Home Base / Dashboard Shell
       ------------------------------------------------------------
       This is the front door of your second brain.
       Everything else (Picker, Today, Inventory, Notes)
       launches from here.
       Built as ONE file: HTML + CSS + JS together. No frameworks.
       ============================================================ -->

  <meta charset="UTF-8">

  <!-- Makes it fit a phone screen properly, including iPhone notch areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iPhone "Add to Home Screen" support: makes it feel like a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0e14">

  <title>JARVIS</title>

  <!-- LATER: we'll add a manifest.json + icons here when we make it
       a full installable PWA. One thing at a time. -->

  <style>
    /* ==========================================================
       THEME — change these few colours and the whole app follows
       ========================================================== */
    :root {
      --bg:      #0a0e14;   /* deep space blue-black           */
      --panel:   #111722;   /* card background                 */
      --accent:  #00d4ff;   /* arc-reactor cyan                */
      --text:    #e8f1f8;   /* main text                       */
      --dim:     #7a8a9e;   /* secondary text                  */
      --glow:    rgba(0, 212, 255, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* Removes the grey flash iPhones show when you tap things */
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      /* Respect the iPhone notch / home bar */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ==========================================================
       HEADER — title, glowing "reactor", greeting, clock
       ========================================================== */
    header {
      text-align: center;
      padding: 36px 20px 24px;
    }

    .title {
      font-size: 1.6rem;
      letter-spacing: 0.45em;      /* spaced-out letters = Jarvis feel */
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 18px var(--glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* The little pulsing dot = the arc reactor. Pure CSS. */
    .reactor {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 8px  var(--glow); opacity: 0.85; }
      50%      { box-shadow: 0 0 22px var(--glow); opacity: 1;    }
    }

    .greeting {
      margin-top: 14px;
      font-size: 1.05rem;
      color: var(--dim);
    }

    .clock {
      margin-top: 4px;
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .date {
      font-size: 0.9rem;
      color: var(--dim);
      margin-top: 2px;
    }

    /* ==========================================================
       DASHBOARD — the big tappable cards (2x2 grid on a phone)
       ========================================================== */
    main {
      flex: 1;
      width: 100%;
      max-width: 520px;            /* stays tidy on big screens too */
      margin: 0 auto;
      padding: 12px 20px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-content: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.18);
      border-radius: 20px;
      padding: 26px 14px;
      min-height: 130px;           /* big touch target */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    /* Press feedback: card dips and glows when tapped */
    .card:active {
      transform: scale(0.96);
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--glow);
    }

    .card svg {
      width: 34px;
      height: 34px;
      color: var(--accent);
    }

    .card-label {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--dim);
    }

    /* ==========================================================
       FOOTER — tiny status line so you know which "mode" you're in
       ========================================================== */
    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.75rem;
      color: var(--dim);
      letter-spacing: 0.06em;
    }

    footer .dot { color: #3ddc84; }  /* green = local mode is healthy */

    /* ==========================================================
       TOAST — the little bubble that pops up ("Coming soon...")
       ========================================================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      box-shadow: 0 0 24px var(--glow);
      opacity: 0;
      pointer-events: none;        /* never blocks taps */
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Respect users who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      .reactor { animation: none; }
      .card, .toast { transition: none; }
    }
  </style>
</head>

<body>

  <!-- ===================== HEADER ===================== -->
  <header>
    <div class="title"><span class="reactor"></span>JARVIS</div>
    <div class="greeting" id="greeting">Hello</div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </header>

  <!-- ===================== THE FOUR DOORS =====================
       Each card is a "door" to a view.
       data-ready="false" = not built yet → shows a toast.
       When we build e.g. picker.html, we flip its data-ready
       to "true" and the card will open it automatically.     -->
  <main>
    <div class="card" data-view="inbox" data-ready="true">
      <!-- inbox tray icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l3-8h12l3 8v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <path d="M3 13h6l2 3h2l2-3h6"/>
      </svg>
      <span class="card-label">Inbox</span>
      <span class="card-sub">dump it, I sort it</span>
    </div>

    <div class="card" data-view="picker" data-ready="true">
      <!-- bubbles icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="7" cy="7" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="12" cy="16.5" r="3.2"/>
      </svg>
      <span class="card-label">Picker</span>
      <span class="card-sub">tap &amp; choose</span>
    </div>

    <div class="card" data-view="today" data-ready="true">
      <!-- calendar icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="5" width="18" height="16" rx="3"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>
      </svg>
      <span class="card-label">Today</span>
      <span class="card-sub">schedule &amp; reminders</span>
    </div>

    <div class="card" data-view="inventory" data-ready="false">
      <!-- box icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><line x1="12" y1="13" x2="12" y2="21"/>
      </svg>
      <span class="card-label">Inventory</span>
      <span class="card-sub">print shop stock</span>
    </div>

    <div class="card" data-view="notes" data-ready="false">
      <!-- note icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="5" y="3" width="14" height="18" rx="2"/>
        <line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="9" y1="16" x2="13" y2="16"/>
      </svg>
      <span class="card-label">Notes</span>
      <span class="card-sub">your second brain</span>
    </div>
  </main>

  <!-- ===================== STATUS LINE ===================== -->
  <footer>
    <span class="dot">●</span> LOCAL MODE — your data stays on this device
    <br>
    <button id="demo-btn" style="display:none; margin-top:10px; padding:10px 18px;
            border-radius:30px; border:1px solid var(--accent); background:none;
            color:var(--accent); font-size:0.8rem; cursor:pointer;">
      Load demo data (testing)
    </button>
  </footer>

  <!-- The toast bubble (hidden until needed) -->
  <div class="toast" id="toast"></div>

  <script>
    /* ==========================================================
       SETTINGS — tweak these to make Jarvis yours
       ========================================================== */
    const NAME = "sir";   // how Jarvis addresses you in the greeting

    /* ==========================================================
       CLOCK + GREETING
       Keeps the time, date, and greeting on screen fresh.
       ========================================================== */
    function updateHeader() {
      const now = new Date();

      // Time, e.g. "6:42 PM"
      document.getElementById("clock").textContent =
        now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

      // Date, e.g. "Friday, October 3"
      document.getElementById("date").textContent =
        now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });

      // Greeting changes with the time of day
      const hour = now.getHours();
      let word = "Good evening";
      if (hour < 12) word = "Good morning";
      else if (hour < 18) word = "Good afternoon";
      document.getElementById("greeting").textContent = word + ", " + NAME + ".";
    }

    updateHeader();                    // run once right away...
    setInterval(updateHeader, 10000);  // ...then refresh every 10 seconds

    /* ==========================================================
       TOAST — pops a small message bubble for 2 seconds
       ========================================================== */
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);  // cancel any previous hide
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    /* ==========================================================
       DEMO DATA — one tap fills the app so you can test it.
       The button only shows when storage is EMPTY, so it never
       tramples your real stuff. Reload the page after tapping.
       ========================================================== */
    const DEMO_INBOX = [
      { id: "d1", text: "take Callie to her friend's house",        bucket: "appointment", when: "at 7",      added: new Date().toISOString() },
      { id: "d2", text: "supplier call about filament pricing",      bucket: "appointment", when: "at 2:30pm", added: new Date().toISOString() },
      { id: "d3", text: "rebuild the van shelving",                  bucket: "project",     when: null,        added: new Date().toISOString() },
      { id: "d4", text: "cable clips for the shop reno",             bucket: "print",      when: null,        added: new Date().toISOString() },
      { id: "d5", text: "voice-controlled shop lights",              bucket: "idea",       when: null,        added: new Date().toISOString() },
      { id: "d6", text: "pick up solder on the way home",            bucket: "errand",     when: null,        added: new Date().toISOString() }
    ];

    const DEMO_QUEUE = [
      { id: "q1", name: "Cable clips ×20",        meta: "PLA grey · ~3h",  first: true  },
      { id: "q2", name: "Phone stand — desk",      meta: "PETG black · ~2h", first: false },
      { id: "q3", name: "Shop sign — Dynamic Media", meta: "PETG teal · ~6h", first: false }
    ];

    function loadDemoData() {
      localStorage.setItem("jarvis.inbox", JSON.stringify(DEMO_INBOX));
      localStorage.setItem("jarvis.printQueue", JSON.stringify(DEMO_QUEUE));
      showToast("Demo data loaded. Check Inbox + Today.");
      document.getElementById("demo-btn").style.display = "none";
    }

    // Show the demo button ONLY when there's nothing stored yet
    (function () {
      const empty = !localStorage.getItem("jarvis.inbox") &&
                    !localStorage.getItem("jarvis.printQueue");
      const btn = document.getElementById("demo-btn");
      if (empty && btn) {
        btn.style.display = "inline-block";
        btn.addEventListener("click", loadDemoData);
      }
    })();

    /* ==========================================================
       CARD ROUTER — what happens when you tap a card
       - View built?  → open its file (e.g. picker.html)
       - Not built?   → friendly toast, never a broken page
       ========================================================== */
    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        const view  = card.dataset.view;                  // e.g. "picker"
        const ready = card.dataset.ready === "true";      // built yet?
        const label = card.querySelector(".card-label").textContent;

        if (ready) {
          window.location.href = view + ".html";
        } else {
          showToast(label + " — coming soon. One thing at a time.");
        }
      });
    });
  </script>
</body>
</html>
