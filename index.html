<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       JARVIS — Home: the conversation screen
       ------------------------------------------------------------
       This IS Jarvis now. One clean screen:
         - His line TYPES out letter by letter (voice stand-in)
         - You answer in the prompt box (until voice ships)
         - Ask for things ("show me my prints") and the bubbles
           appear in a centered column — tap your picks, pause
           three seconds, then he asks which to start with.

       He greets you with your day brought UP: appointments from
       the Inbox, your print queue from the Picker.

       The old card dashboard still exists as dashboard.html
       (linked up top as "Cards"), along with today/inbox views.

       ONE file: HTML + CSS + JS. No frameworks.
       ============================================================ -->

  <meta charset="UTF-8">

  <!-- Fit phone screens, including iPhone notch areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iPhone "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0e14">

  <title>JARVIS</title>

  <style>
    /* ==========================================================
       THEME
       ========================================================== */
    :root {
      --bg:      #0a0e14;
      --panel:   #111722;
      --accent:  #00d4ff;
      --text:    #e8f1f8;
      --dim:     #7a8a9e;
      --good:    #3ddc84;
      --appt:    #ff5c5c;
      --glow:    rgba(0, 212, 255, 0.35);
      --settle:  cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100dvh;              /* no jump when iPhone URL bar hides */
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ==========================================================
       TOP — reactor + wordmark + tiny view links
       ========================================================== */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 10px;
    }

    .reactor {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }

    .reactor.thinking {            /* pulses faster while he "types" */
      animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 7px  var(--glow); opacity: 0.85; }
      50%      { box-shadow: 0 0 20px var(--glow); opacity: 1;    }
    }

    .wordmark {
      font-size: 1rem;
      letter-spacing: 0.4em;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 14px var(--glow);
    }

    .topbar-links {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .topbar-links a {
      display: flex;
      align-items: center;
      min-height: 44px;
      color: var(--dim);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 8px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .topbar-links a:active {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ==========================================================
       CHAT — the conversation scroll area
       ========================================================== */
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat > * { flex-shrink: 0; }

    /* --- his line (types out) --- */
    .line-jarvis {
      display: grid;
      align-self: flex-start;
      max-width: 88%;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 16px;
      font-size: 1rem;
      line-height: 1.45;
      animation: rise 0.32s var(--settle);
    }

    .line-copy, .line-typing { grid-area: 1 / 1; min-width: 0; overflow-wrap: anywhere; }
    .line-copy { visibility: hidden; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* blinking caret while he types */
    .caret::after {
      content: "▌";
      color: var(--accent);
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ==========================================================
       CARD LIST — centered, in normal flow so cards never overlap
       ========================================================== */
    .sky {
      align-self: stretch;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      gap: 16px;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
      border: 1px solid rgba(0, 212, 255, 0.12);
      border-radius: 18px;
      background: rgba(17, 23, 34, 0.5);
      animation: rise 0.36s var(--settle);
    }

    .bubble {
      width: 100%;
      min-width: 0;
      min-height: 64px;
      text-align: left;
      font: inherit;
      color: var(--text);
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
      transition: opacity 0.24s ease,
                  background-color 0.18s ease-out,
                  border-color 0.18s ease-out, box-shadow 0.18s ease-out;
    }

    .bubble-name { font-size: 1rem; font-weight: 600; line-height: 1.35; }
    .bubble-meta { margin-top: 4px; font-size: 0.85rem; color: var(--dim); }
    .bubble:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .bubble.picked {
      animation: none;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--glow);
      background: rgba(0, 212, 255, 0.08);
    }

    /* ==========================================================
       PROMPT BOX — your voice, for now
       ========================================================== */
    .prompt {
      display: flex;
      gap: 10px;
      padding: 10px 16px 16px;
    }

    #prompt-input {
      flex: 1;
      min-width: 0;
      padding: 16px;
      border-radius: 30px;
      border: 1px solid rgba(0, 212, 255, 0.35);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    #prompt-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
    }

    #prompt-input::placeholder { color: var(--dim); }

    .send-btn {
      width: 56px;
      height: 56px;
      flex: none;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #04222b;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .send-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 20px var(--glow);
    }

    @media (prefers-reduced-motion: reduce) {
      .reactor, .bubble, .caret::after { animation: none; }
      .line-jarvis, .sky { animation: none; }
      .bubble, .send-btn { transition: none; }
      .send-btn:active { transform: none; }
    }
  </style>
</head>

<body>

  <!-- ===================== TOP ===================== -->
  <div class="topbar">
    <span class="reactor" id="reactor"></span>
    <span class="wordmark">JARVIS</span>
    <nav class="topbar-links">
      <a href="today.html">Today</a>
      <a href="inbox.html">Inbox</a>
      <a href="dashboard.html">Cards</a>
    </nav>
  </div>

  <!-- ===================== CONVERSATION ===================== -->
  <div class="chat" id="chat"></div>

  <!-- ===================== PROMPT ===================== -->
  <div class="prompt">
    <input id="prompt-input" type="text" autocomplete="off"
           placeholder='Talk to me… try "show me my prints"'>
    <button class="send-btn" id="send-btn" aria-label="Send">↑</button>
  </div>

  <script>
    /* ==========================================================
       SETTINGS
       ========================================================== */
    const NAME = "sir";
    const TYPE_SPEED = 22;   // ms per character — his "voice"
    const PICK_PAUSE = 3000;

    /* ==========================================================
       STORAGE HELPERS — same keys the other views use
       ========================================================== */
    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }
    function saveJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    /* ==========================================================
       PRINT CATALOG — the pool "show me my prints" pulls from.
       localStorage step for now; Google Sheets swaps in later.
       ========================================================== */
    const PRINT_CATALOG = [
      { id: "p1",  name: "Phone stand — desk",        meta: "PETG black · ~2h"     },
      { id: "p2",  name: "Panel mount bracket",       meta: "Electric Boyes · ~1h" },
      { id: "p3",  name: "Cable clips ×20",           meta: "PLA grey · ~3h"       },
      { id: "p4",  name: "Label maker battery cover", meta: "PLA white · ~45m"     },
      { id: "p5",  name: "Shop sign — Dynamic Media", meta: "PETG teal · ~6h"      },
      { id: "p6",  name: "Filament dry box clips",    meta: "PETG · ~1h"           },
      { id: "p7",  name: "Drill bit organizer",       meta: "PLA red · ~4h"        },
      { id: "p8",  name: "Key fob — shop logo",       meta: "PLA silk · ~30m"      },
      { id: "p9",  name: "Outlet cover spacers",      meta: "Electric Boyes · ~1h" },
      { id: "p10", name: "Headphone wall hook",       meta: "PETG black · ~2h"     }
    ];

    /* ==========================================================
       DOM HANDLES + STATE
       ========================================================== */
    const chat    = document.getElementById("chat");
    const input   = document.getElementById("prompt-input");
    const reactor = document.getElementById("reactor");

    let typing = false;       // don't accept input mid-sentence
    let picker = null;        // live picker state, or null when no sky is open

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    async function fadeElements(elements, from, to, duration) {
      if (reduceMotion() || !Element.prototype.animate) return;
      await Promise.all(elements.map(el => el.animate(
        [{ opacity: from }, { opacity: to }],
        { duration, easing: "ease-in-out", fill: "forwards" }
      ).finished));
    }

    async function settleCards(sky, selected) {
      const cards = [...sky.querySelectorAll(".bubble")];
      const remaining = selected.map(item =>
        sky.querySelector('[data-id="' + item.id + '"]'));
      const dismissed = cards.filter(card => !remaining.includes(card));
      const animated = !reduceMotion() && Boolean(Element.prototype.animate);
      cards.forEach(card => { card.disabled = true; });

      await fadeElements(dismissed, 1, 0, 240);
      // Reorder only while invisible, so selected cards never cross.
      await fadeElements(remaining, 1, 0, 140);
      const oldHeight = sky.getBoundingClientRect().height;
      dismissed.forEach(card => card.remove());
      remaining.forEach(card => {
        if (animated) card.getAnimations().forEach(animation => animation.cancel());
        card.removeAttribute("aria-pressed");
        sky.appendChild(card);
      });
      const newHeight = sky.getBoundingClientRect().height;
      if (animated) {
        // One measured height transition prevents the surrounding page jumping.
        const resize = sky.animate(
          [{ height: oldHeight + "px" }, { height: newHeight + "px" }],
          { duration: 320, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
        );
        await Promise.all([resize.finished, fadeElements(remaining, 0, 1, 320)]);
        remaining.forEach(card => card.getAnimations().forEach(animation => animation.cancel()));
      }
      remaining.forEach(card => { card.disabled = false; });
    }

    /* ==========================================================
       JARVIS SPEAKS — types a line into the chat, letter by
       letter. Returns a Promise so lines can chain in order.
       ========================================================== */
    function jarvisSays(text) {
      return new Promise(resolve => {
        typing = true;
        reactor.classList.add("thinking");

        const line = document.createElement("div");
        line.className = "line-jarvis";
        const copy = document.createElement("span");
        copy.className = "line-copy";
        copy.setAttribute("aria-hidden", "true");
        copy.textContent = text;
        const spoken = document.createElement("span");
        spoken.className = "line-typing caret";
        line.append(copy, spoken);
        chat.appendChild(line);
        scrollChat();

        if (reduceMotion()) {
          spoken.textContent = text;
          spoken.classList.remove("caret");
          reactor.classList.remove("thinking");
          typing = false;
          resolve();
          return;
        }

        let i = 0;
        const tick = setInterval(() => {
          spoken.textContent = text.slice(0, ++i);
          if (i >= text.length) {
            clearInterval(tick);
            spoken.classList.remove("caret");
            reactor.classList.remove("thinking");
            typing = false;
            resolve();
          }
        }, TYPE_SPEED);
      });
    }

    function scrollChat() {
      chat.scrollTo({ top: chat.scrollHeight, behavior: reduceMotion() ? "auto" : "smooth" });
    }

    /* ==========================================================
       THE SKY — centered suggestion cards inside the chat
       ========================================================== */
    function openSky(items) {
      picker = { phase: "pick", items: [...items], picked: [], el: null, timer: null };

      const sky = document.createElement("div");
      sky.className = "sky";
      chat.appendChild(sky);
      picker.el = sky;

      picker.items.forEach(item => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "bubble";
        b.dataset.id = item.id;
        b.setAttribute("aria-pressed", "false");
        b.innerHTML =
          '<div class="bubble-name"></div><div class="bubble-meta"></div>';
        b.querySelector(".bubble-name").textContent = item.name;
        b.querySelector(".bubble-meta").textContent = item.meta;
        b.addEventListener("click", () => onBubbleTap(item.id));
        sky.appendChild(b);
      });

      chat.scrollTo({
        top: sky.offsetTop - chat.offsetTop,
        behavior: reduceMotion() ? "auto" : "smooth"
      });
    }

    function schedulePicks() {
      clearTimeout(picker.timer);
      if (!picker.picked.length) return;
      picker.timer = setTimeout(() => {
        // Do not interrupt a sentence being typed by either person.
        if (typing || input.value.trim()) schedulePicks();
        else confirmPicks();
      }, PICK_PAUSE);
    }

    function onBubbleTap(id) {
      if (!picker) return;

      if (picker.phase === "pick") {
        const item  = picker.items.find(i => i.id === id);
        const index = picker.picked.findIndex(p => p.id === id);
        if (index >= 0) picker.picked.splice(index, 1);
        else            picker.picked.push(item);

        const bubble = picker.el.querySelector('[data-id="' + id + '"]');
        bubble.classList.toggle("picked");
        bubble.setAttribute("aria-pressed", bubble.classList.contains("picked"));
        schedulePicks();
      } else if (picker.phase === "chooseFirst") {
        startWith(picker.picked.find(p => p.id === id));
      }
    }

    /* ==========================================================
       PICKER FLOW — confirm picks → rest fade away → which first?
       ========================================================== */
    async function confirmPicks() {
      if (!picker || picker.phase !== "pick") return;
      clearTimeout(picker.timer);
      if (picker.picked.length === 0) {
        await jarvisSays("Nothing selected — tap a few bubbles first.");
        return;
      }

      const activePicker = picker;
      activePicker.phase = "settling";
      const survivors = [...activePicker.picked];
      await settleCards(activePicker.el, survivors);
      activePicker.items = survivors;
      activePicker.phase = "chooseFirst";

      await jarvisSays(survivors.length + " it is. Which one first — tap it or name it.");
    }

    async function startWith(item) {
      picker.phase = "done";

      const list = picker.picked.map(p => ({ ...p, first: p.id === item.id }));
      saveJSON("jarvis.printQueue", list);

      const skyEl = picker.el;
      skyEl.querySelectorAll(".bubble").forEach(card => { card.disabled = true; });
      picker = null;
      await fadeElements([skyEl], 1, 0, 240);
      skyEl.remove();
      await jarvisSays('Starting with "' + item.name + '." Your list of ' +
                       list.length + " is saved — waiting in Today.");
    }

    /* ==========================================================
       INBOX SORTER — same rules as inbox.html
       ========================================================== */
    function sortItem(text) {
      const lower = text.toLowerCase();
      const timeMatch = lower.match(/\bat\s+(\d{1,2})(:\d{2})?\s*(am|pm)?\b|\b(\d{1,2}:\d{2})\s*(am|pm)?\b/);
      if (timeMatch) return { bucket: "appointment", when: timeMatch[0].trim() };
      if (/\b(print|filament|pla|petg|nozzle|gcode)\b/.test(lower))  return { bucket: "print" };
      if (/\b(project|build|make|design|install)\b/.test(lower))     return { bucket: "project" };
      if (/\b(pick up|drop off|buy|order|store|take)\b/.test(lower)) return { bucket: "errand" };
      if (/\b(idea|maybe|what if|someday|could)\b/.test(lower))      return { bucket: "idea" };
      return { bucket: "task" };
    }

    /* ==========================================================
       THE GREETING — he brings your day UP to you
       ========================================================== */
    async function greet(askAfter) {
      const now   = new Date();
      const hour  = now.getHours();
      const word  = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
      const inbox = loadJSON("jarvis.inbox", []);
      const queue = loadJSON("jarvis.printQueue", []);
      const appts = inbox.filter(i => i.bucket === "appointment");

      let line = word + ", " + NAME + ".";
      if (appts.length > 0) {
        line += " You have " + appts.length + " appointment" + (appts.length > 1 ? "s" : "") +
                " today — first up: " + appts[0].text +
                (appts[0].when ? " (" + appts[0].when + ")" : "") + ".";
      }
      if (queue.length > 0) {
        line += " " + queue.length + " print" + (queue.length > 1 ? "s are" : " is") + " queued.";
      }
      if (appts.length === 0 && queue.length === 0) {
        line += " Clear day — nothing timed, nothing queued.";
      }
      if (askAfter) line += " What would you like to do?";

      await jarvisSays(line);
    }

    /* ==========================================================
       INTENT ROUTER — COMMAND / QUESTION / DUMP / UNCLEAR
       Your rule: unclear → ask, never guess.
       (Rule-based for now; DeepSeek swaps in later.)
       ========================================================== */
    async function route(text) {
      const lower = text.toLowerCase();

      // --- mid-picker conversation ---
      if (picker) {
        if (picker.phase === "pick") {
          if (/\b(done|that'?s all|those|confirm)\b/.test(lower)) return confirmPicks();
          if (/\ball\b/.test(lower)) {
            picker.items.forEach(i => {
              if (!picker.picked.some(p => p.id === i.id)) picker.picked.push(i);
              picker.el.querySelector('[data-id="' + i.id + '"]')
                .classList.add("picked");
            });
            picker.el.querySelectorAll(".bubble").forEach(b =>
              b.setAttribute("aria-pressed", "true"));
            schedulePicks();
            return jarvisSays("All selected. I'll line them up after a short pause.");
          }
          return jarvisSays("Tap the ones you want — or say done.");
        }
        if (picker.phase === "settling") return;
        if (picker.phase === "chooseFirst") {
          const num = lower.match(/\b(1st|first|2nd|second|3rd|third|\d+)\b/);
          let choice = null;
          if (num) {
            const n = { "1st": 1, "first": 1, "2nd": 2, "second": 2,
                        "3rd": 3, "third": 3 }[num[1]] || parseInt(num[1], 10);
            choice = picker.picked[n - 1];
          }
          if (!choice) {
            choice = picker.picked.find(p =>
              lower.includes(p.name.toLowerCase().split(" ")[0]));
          }
          if (choice) return startWith(choice);
          return jarvisSays("Which one — tap it, or name it.");
        }
      }

      // --- QUESTION: what's on today? ---
      if (/\b(what('| i)s on|today|appointments?|schedule|my day|briefing)\b/.test(lower)) {
        return greet(false);
      }

      // --- COMMAND: show me prints ---
      if (/\b(show|prints?|print list|pick|choose|queue)\b/.test(lower)) {
        await jarvisSays("Of course. Tap your prints. After a 3-second pause, I'll line up your picks. You can also say done.");
        return openSky(PRINT_CATALOG);
      }

      // --- QUESTION: inbox? ---
      if (/\binbox\b/.test(lower)) {
        const inbox = loadJSON("jarvis.inbox", []);
        return jarvisSays(inbox.length
          ? "You have " + inbox.length + " items in your inbox. Tap Inbox up top to review them."
          : "Inbox is empty, " + NAME + ".");
      }

      // --- DUMP: remember / note / remind me ---
      if (/\b(remember|note|remind me|add|dump)\b/.test(lower)) {
        const clean  = text.replace(/^(remember|note|remind me( to)?|add|dump)\s*/i, "");
        const sorted = sortItem(clean);
        const inbox  = loadJSON("jarvis.inbox", []);
        inbox.unshift({
          id: Date.now().toString(),
          text: clean,
          bucket: sorted.bucket,
          when: sorted.when || null,
          added: new Date().toISOString()
        });
        saveJSON("jarvis.inbox", inbox);
        return jarvisSays(sorted.when
          ? 'Filed under Appointments — "' + sorted.when + '" noted. I\'ll bring it up.'
          : "Noted — filed under " + sorted.bucket + "s.");
      }

      // --- greetings ---
      if (/^(hi|hey|hello|morning|afternoon|evening|jarvis)\b/.test(lower)) {
        return greet(false);
      }

      // --- UNCLEAR → ask, never guess ---
      return jarvisSays(
        'Not sure what you need, ' + NAME + '. Ask "what\'s on today", ' +
        'say "show me my prints", or tell me to remember something.');
    }

    /* ==========================================================
       INPUT WIRING
       ========================================================== */
    function send() {
      const text = input.value.trim();
      if (!text || typing) return;
      input.value = "";
      route(text);
    }

    document.getElementById("send-btn").addEventListener("click", send);
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
    input.addEventListener("input", () => {
      if (picker && picker.phase === "pick") schedulePicks();
    });

    /* ==========================================================
       OPEN — he speaks first
       ========================================================== */
    greet(true);
  </script>
</body>
</html>
