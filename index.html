<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       JARVIS — Home: the conversation screen
       ------------------------------------------------------------
       This IS Jarvis now. One clean screen:
         - His line TYPES out letter by letter (voice stand-in)
         - You answer in the prompt box (until voice ships)
         - Ask for things ("show me my prints") and the bubbles
           rise up right here in the chat — tap your picks, the
           rest drift away, he asks which to start with.

       He greets you with your day brought UP: appointments from
       the Inbox, your print queue from the Picker.

       The old card dashboard still exists as dashboard.html
       (linked up top as "Cards"), along with today/inbox views.

       ONE file: HTML + CSS + JS. No frameworks.
       ============================================================ -->

  <meta charset="UTF-8">

  <!-- Fit phone screens, including iPhone notch areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iPhone "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0e14">

  <title>JARVIS</title>

  <style>
    /* ==========================================================
       THEME
       ========================================================== */
    :root {
      --bg:      #0a0e14;
      --panel:   #111722;
      --accent:  #00d4ff;
      --text:    #e8f1f8;
      --dim:     #7a8a9e;
      --good:    #3ddc84;
      --appt:    #ff5c5c;
      --glow:    rgba(0, 212, 255, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100dvh;              /* no jump when iPhone URL bar hides */
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ==========================================================
       TOP — reactor + wordmark + tiny view links
       ========================================================== */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 10px;
    }

    .reactor {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }

    .reactor.thinking {            /* pulses faster while he "types" */
      animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 7px  var(--glow); opacity: 0.85; }
      50%      { box-shadow: 0 0 20px var(--glow); opacity: 1;    }
    }

    .wordmark {
      font-size: 1rem;
      letter-spacing: 0.4em;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 14px var(--glow);
    }

    .topbar-links {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .topbar-links a {
      color: var(--dim);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 8px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .topbar-links a:active {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ==========================================================
       CHAT — the conversation scroll area
       ========================================================== */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* --- his line (types out) --- */
    .line-jarvis {
      align-self: flex-start;
      max-width: 88%;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 16px;
      font-size: 1rem;
      line-height: 1.45;
      animation: rise 0.25s ease;
    }

    /* --- your line --- */
    .line-you {
      align-self: flex-end;
      max-width: 88%;
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.35);
      border-radius: 18px 4px 18px 18px;
      padding: 13px 16px;
      font-size: 1rem;
      line-height: 1.45;
      animation: rise 0.25s ease;
    }

    .line-you .who {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      margin-bottom: 4px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* blinking caret while he types */
    .caret::after {
      content: "▌";
      color: var(--accent);
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ==========================================================
       BUBBLE SKY — appears inside the chat when you ask for it
       ========================================================== */
    .sky {
      position: relative;
      height: 340px;
      align-self: stretch;
      border: 1px solid rgba(0, 212, 255, 0.12);
      border-radius: 18px;
      background: rgba(17, 23, 34, 0.5);
      overflow: hidden;
      animation: rise 0.35s ease;
    }

    .bubble {
      position: absolute;
      left: var(--x);
      top:  var(--y);
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 16px;
      padding: 12px 14px;
      min-width: 130px;
      max-width: 180px;
      cursor: pointer;
      animation: bob 4s ease-in-out infinite;
      animation-delay: var(--delay);
      transition: left 0.6s cubic-bezier(.22,1,.36,1),
                  top  0.6s cubic-bezier(.22,1,.36,1),
                  transform 0.5s ease, opacity 0.5s ease,
                  border-color 0.2s ease, box-shadow 0.2s ease;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0);    }
      50%      { transform: translateY(-6px); }
    }

    .bubble:active { transform: scale(0.95); }

    .bubble-name { font-size: 0.9rem; font-weight: 600; line-height: 1.25; }
    .bubble-meta { margin-top: 3px; font-size: 0.68rem; color: var(--dim); }

    .bubble.picked {
      animation: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--glow);
      background: rgba(0, 212, 255, 0.08);
    }

    .bubble.dismissed {
      animation: none;
      opacity: 0;
      transform: translateY(80px) scale(0.5);
      pointer-events: none;
    }

    /* ==========================================================
       PROMPT BOX — your voice, for now
       ========================================================== */
    .prompt {
      display: flex;
      gap: 10px;
      padding: 10px 16px 16px;
    }

    #prompt-input {
      flex: 1;
      padding: 16px;
      border-radius: 30px;
      border: 1px solid rgba(0, 212, 255, 0.35);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    #prompt-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
    }

    #prompt-input::placeholder { color: var(--dim); }

    .send-btn {
      width: 56px;
      height: 56px;
      flex: none;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #04222b;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .send-btn:active {
      transform: scale(0.9);
      box-shadow: 0 0 20px var(--glow);
    }

    @media (max-width: 380px) {
      .bubble { min-width: 118px; max-width: 150px; padding: 10px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reactor, .bubble, .caret::after { animation: none; }
      .line-jarvis, .line-you, .sky { animation: none; }
      .bubble { transition: opacity 0.2s ease; }
    }
  </style>
</head>

<body>

  <!-- ===================== TOP ===================== -->
  <div class="topbar">
    <span class="reactor" id="reactor"></span>
    <span class="wordmark">JARVIS</span>
    <nav class="topbar-links">
      <a href="today.html">Today</a>
      <a href="inbox.html">Inbox</a>
      <a href="dashboard.html">Cards</a>
    </nav>
  </div>

  <!-- ===================== CONVERSATION ===================== -->
  <div class="chat" id="chat"></div>

  <!-- ===================== PROMPT ===================== -->
  <div class="prompt">
    <input id="prompt-input" type="text" autocomplete="off"
           placeholder='Talk to me… try "show me my prints"'>
    <button class="send-btn" id="send-btn" aria-label="Send">↑</button>
  </div>

  <script>
    /* ==========================================================
       SETTINGS
       ========================================================== */
    const NAME = "sir";
    const TYPE_SPEED = 22;   // ms per character — his "voice"

    /* ==========================================================
       STORAGE HELPERS — same keys the other views use
       ========================================================== */
    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }
    function saveJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    /* ==========================================================
       PRINT CATALOG — the pool "show me my prints" pulls from.
       localStorage step for now; Google Sheets swaps in later.
       ========================================================== */
    const PRINT_CATALOG = [
      { id: "p1",  name: "Phone stand — desk",        meta: "PETG black · ~2h"     },
      { id: "p2",  name: "Panel mount bracket",       meta: "Electric Boyes · ~1h" },
      { id: "p3",  name: "Cable clips ×20",           meta: "PLA grey · ~3h"       },
      { id: "p4",  name: "Label maker battery cover", meta: "PLA white · ~45m"     },
      { id: "p5",  name: "Shop sign — Dynamic Media", meta: "PETG teal · ~6h"      },
      { id: "p6",  name: "Filament dry box clips",    meta: "PETG · ~1h"           },
      { id: "p7",  name: "Drill bit organizer",       meta: "PLA red · ~4h"        },
      { id: "p8",  name: "Key fob — shop logo",       meta: "PLA silk · ~30m"      },
      { id: "p9",  name: "Outlet cover spacers",      meta: "Electric Boyes · ~1h" },
      { id: "p10", name: "Headphone wall hook",       meta: "PETG black · ~2h"     }
    ];

    /* ==========================================================
       DOM HANDLES + STATE
       ========================================================== */
    const chat    = document.getElementById("chat");
    const input   = document.getElementById("prompt-input");
    const reactor = document.getElementById("reactor");

    let typing = false;       // don't accept input mid-sentence
    let picker = null;        // live picker state, or null when no sky is open

    /* ==========================================================
       JARVIS SPEAKS — types a line into the chat, letter by
       letter. Returns a Promise so lines can chain in order.
       ========================================================== */
    function jarvisSays(text) {
      return new Promise(resolve => {
        typing = true;
        reactor.classList.add("thinking");

        const line = document.createElement("div");
        line.className = "line-jarvis caret";
        chat.appendChild(line);
        scrollChat();

        let i = 0;
        const tick = setInterval(() => {
          line.textContent = text.slice(0, ++i);
          scrollChat();
          if (i >= text.length) {
            clearInterval(tick);
            line.classList.remove("caret");
            reactor.classList.remove("thinking");
            typing = false;
            resolve();
          }
        }, TYPE_SPEED);
      });
    }

    function youSaid(text) {
      const line = document.createElement("div");
      line.className = "line-you";
      line.innerHTML = '<span class="who">YOU</span>';
      line.appendChild(document.createTextNode(text));
      chat.appendChild(line);
      scrollChat();
    }

    function scrollChat() {
      chat.scrollTop = chat.scrollHeight;
    }

    /* ==========================================================
       THE SKY — bubbles rise inside the chat when asked
       ========================================================== */
    function openSky(items) {
      picker = { phase: "pick", items: [...items], picked: [], el: null };

      const sky = document.createElement("div");
      sky.className = "sky";
      chat.appendChild(sky);
      picker.el = sky;

      picker.items.forEach(item => {
        const b = document.createElement("div");
        b.className = "bubble";
        b.dataset.id = item.id;
        b.style.setProperty("--delay", (Math.random() * 2).toFixed(2) + "s");
        b.innerHTML =
          '<div class="bubble-name"></div><div class="bubble-meta"></div>';
        b.querySelector(".bubble-name").textContent = item.name;
        b.querySelector(".bubble-meta").textContent = item.meta;
        b.addEventListener("click", () => onBubbleTap(item.id));
        sky.appendChild(b);
      });

      layoutSky(sky);
      scrollChat();
    }

    /* Deal bubbles: picked ones float up into a tidy row,
       unpicked ones drift loose in the lower sky. */
    function layoutSky(sky) {
      const bubbles = sky.querySelectorAll(".bubble:not(.dismissed)");
      let pickRow = 0, pickCol = 0, restRow = 0, restCol = 0;
      bubbles.forEach(b => {
        if (b.classList.contains("picked")) {
          b.style.setProperty("--x", (5 + pickCol * 48) + "%");
          b.style.setProperty("--y", (5 + pickRow * 26) + "%");
          pickCol++; if (pickCol > 1) { pickCol = 0; pickRow++; }
        } else {
          b.style.setProperty("--x", (5 + restCol * 48) + "%");
          b.style.setProperty("--y", (34 + restRow * 22) + "%");
          restCol++; if (restCol > 1) { restCol = 0; restRow++; }
        }
      });
    }

    function onBubbleTap(id) {
      if (!picker) return;

      if (picker.phase === "pick") {
        const item  = picker.items.find(i => i.id === id);
        const index = picker.picked.findIndex(p => p.id === id);
        if (index >= 0) picker.picked.splice(index, 1);
        else            picker.picked.push(item);

        const bubble = picker.el.querySelector('[data-id="' + id + '"]');
        bubble.classList.toggle("picked");
        layoutSky(picker.el);
      } else if (picker.phase === "chooseFirst") {
        startWith(picker.picked.find(p => p.id === id));
      }
    }

    /* ==========================================================
       PICKER FLOW — confirm picks → rest drift away → which first?
       ========================================================== */
    async function confirmPicks() {
      if (picker.picked.length === 0) {
        await jarvisSays("Nothing selected — tap a few bubbles first.");
        return;
      }

      // The rest sink, shrink, fade.
      picker.items.forEach(item => {
        if (!picker.picked.some(p => p.id === item.id)) {
          picker.el.querySelector('[data-id="' + item.id + '"]')
            .classList.add("dismissed");
        }
      });

      await new Promise(r => setTimeout(r, 650));   // let them drift

      // Rebuild the sky with only your picks, together up top
      const survivors = [...picker.picked];
      picker.el.remove();
      openSky(survivors);
      picker.phase = "chooseFirst";
      picker.items.forEach(i =>
        picker.el.querySelector('[data-id="' + i.id + '"]')
          .classList.add("picked"));
      layoutSky(picker.el);

      await jarvisSays(survivors.length + " it is. Which one first — tap it or name it.");
    }

    async function startWith(item) {
      picker.phase = "done";

      const list = picker.picked.map(p => ({ ...p, first: p.id === item.id }));
      saveJSON("jarvis.printQueue", list);

      // The sky fades out — job done, back to conversation
      const skyEl = picker.el;
      skyEl.style.transition = "opacity 0.5s ease";
      skyEl.style.opacity = "0";
      setTimeout(() => skyEl.remove(), 550);
      picker = null;

      await jarvisSays('Starting with "' + item.name + '." Your list of ' +
                       list.length + " is saved — waiting in Today.");
    }

    /* ==========================================================
       INBOX SORTER — same rules as inbox.html
       ========================================================== */
    function sortItem(text) {
      const lower = text.toLowerCase();
      const timeMatch = lower.match(/\bat\s+(\d{1,2})(:\d{2})?\s*(am|pm)?\b|\b(\d{1,2}:\d{2})\s*(am|pm)?\b/);
      if (timeMatch) return { bucket: "appointment", when: timeMatch[0].trim() };
      if (/\b(print|filament|pla|petg|nozzle|gcode)\b/.test(lower))  return { bucket: "print" };
      if (/\b(project|build|make|design|install)\b/.test(lower))     return { bucket: "project" };
      if (/\b(pick up|drop off|buy|order|store|take)\b/.test(lower)) return { bucket: "errand" };
      if (/\b(idea|maybe|what if|someday|could)\b/.test(lower))      return { bucket: "idea" };
      return { bucket: "task" };
    }

    /* ==========================================================
       THE GREETING — he brings your day UP to you
       ========================================================== */
    async function greet(askAfter) {
      const now   = new Date();
      const hour  = now.getHours();
      const word  = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
      const inbox = loadJSON("jarvis.inbox", []);
      const queue = loadJSON("jarvis.printQueue", []);
      const appts = inbox.filter(i => i.bucket === "appointment");

      let line = word + ", " + NAME + ".";
      if (appts.length > 0) {
        line += " You have " + appts.length + " appointment" + (appts.length > 1 ? "s" : "") +
                " today — first up: " + appts[0].text +
                (appts[0].when ? " (" + appts[0].when + ")" : "") + ".";
      }
      if (queue.length > 0) {
        line += " " + queue.length + " print" + (queue.length > 1 ? "s are" : " is") + " queued.";
      }
      if (appts.length === 0 && queue.length === 0) {
        line += " Clear day — nothing timed, nothing queued.";
      }
      if (askAfter) line += " What would you like to do?";

      await jarvisSays(line);
    }

    /* ==========================================================
       INTENT ROUTER — COMMAND / QUESTION / DUMP / UNCLEAR
       Your rule: unclear → ask, never guess.
       (Rule-based for now; DeepSeek swaps in later.)
       ========================================================== */
    async function route(text) {
      const lower = text.toLowerCase();

      // --- mid-picker conversation ---
      if (picker) {
        if (picker.phase === "pick") {
          if (/\b(done|that'?s all|those|confirm)\b/.test(lower)) return confirmPicks();
          if (/\ball\b/.test(lower)) {
            picker.items.forEach(i => {
              if (!picker.picked.some(p => p.id === i.id)) picker.picked.push(i);
              picker.el.querySelector('[data-id="' + i.id + '"]')
                .classList.add("picked");
            });
            layoutSky(picker.el);
            return jarvisSays("All of them, then. Say done when ready.");
          }
          return jarvisSays("Tap the ones you want — or say done.");
        }
        if (picker.phase === "chooseFirst") {
          const num = lower.match(/\b(1st|first|2nd|second|3rd|third|\d+)\b/);
          let choice = null;
          if (num) {
            const n = { "1st": 1, "first": 1, "2nd": 2, "second": 2,
                        "3rd": 3, "third": 3 }[num[1]] || parseInt(num[1], 10);
            choice = picker.picked[n - 1];
          }
          if (!choice) {
            choice = picker.picked.find(p =>
              lower.includes(p.name.toLowerCase().split(" ")[0]));
          }
          if (choice) return startWith(choice);
          return jarvisSays("Which one — tap it, or name it.");
        }
      }

      // --- QUESTION: what's on today? ---
      if (/\b(what('| i)s on|today|appointments?|schedule|my day|briefing)\b/.test(lower)) {
        return greet(false);
      }

      // --- COMMAND: show me prints ---
      if (/\b(show|prints?|print list|pick|choose|queue)\b/.test(lower)) {
        await jarvisSays("Of course. Here are your prints — tap the ones you want, then say done.");
        return openSky(PRINT_CATALOG);
      }

      // --- QUESTION: inbox? ---
      if (/\binbox\b/.test(lower)) {
        const inbox = loadJSON("jarvis.inbox", []);
        return jarvisSays(inbox.length
          ? "You have " + inbox.length + " items in your inbox. Tap Inbox up top to review them."
          : "Inbox is empty, " + NAME + ".");
      }

      // --- DUMP: remember / note / remind me ---
      if (/\b(remember|note|remind me|add|dump)\b/.test(lower)) {
        const clean  = text.replace(/^(remember|note|remind me( to)?|add|dump)\s*/i, "");
        const sorted = sortItem(clean);
        const inbox  = loadJSON("jarvis.inbox", []);
        inbox.unshift({
          id: Date.now().toString(),
          text: clean,
          bucket: sorted.bucket,
          when: sorted.when || null,
          added: new Date().toISOString()
        });
        saveJSON("jarvis.inbox", inbox);
        return jarvisSays(sorted.when
          ? 'Filed under Appointments — "' + sorted.when + '" noted. I\'ll bring it up.'
          : "Noted — filed under " + sorted.bucket + "s.");
      }

      // --- greetings ---
      if (/^(hi|hey|hello|morning|afternoon|evening|jarvis)\b/.test(lower)) {
        return greet(false);
      }

      // --- UNCLEAR → ask, never guess ---
      return jarvisSays(
        'Not sure what you need, ' + NAME + '. Ask "what\'s on today", ' +
        'say "show me my prints", or tell me to remember something.');
    }

    /* ==========================================================
       INPUT WIRING
       ========================================================== */
    function send() {
      const text = input.value.trim();
      if (!text || typing) return;
      input.value = "";
      youSaid(text);
      route(text);
    }

    document.getElementById("send-btn").addEventListener("click", send);
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    /* ==========================================================
       OPEN — he speaks first
       ========================================================== */
    greet(true);
  </script>
</body>
</html>
